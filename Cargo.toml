[workspace]
resolver = "2"
members = [
  "crates/qr-lab-image",
  "crates/qr-lab-geometry",
  "crates/qr-lab-imgproc",
  "crates/qr-lab-qr",
  "crates/qr-lab",
  "crates/qr-lab-core",
  "crates/qr-lab-wasm",
  "crates/qr-lab-bench",
  "crates/qr-lab-ffi",
  "bindings/python",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
license = "MIT"
authors = ["Auki Labs"]
repository = "https://github.com/aukilabs/qr-lab"
homepage = "https://github.com/aukilabs/qr-lab"
readme = "README.md"

# Mobile / size-sensitive release for qr-lab-ffi (cdylib + staticlib).
# Host benches/tests keep the default release profile.
[profile.release-mobile]
inherits = "release"
lto = true
codegen-units = 1
opt-level = 3
strip = true
panic = "abort"
