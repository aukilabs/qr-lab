[workspace]
resolver = "2"
members = [
  "crates/qrkit-image",
  "crates/qrkit-geometry",
  "crates/qrkit-imgproc",
  "crates/qrkit-qr",
  "crates/qrkit",
  "crates/qrk-core",
  "crates/qrk-wasm",
  "crates/qrk-bench",
  "crates/qrk-ffi",
  "bindings/python",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
license = "MIT"
repository = "https://github.com/aukilabs/qrkit"

# Mobile / size-sensitive release for qrk-ffi (cdylib + staticlib).
# Host benches/tests keep the default release profile.
[profile.release-mobile]
inherits = "release"
lto = true
codegen-units = 1
opt-level = 3
strip = true
panic = "abort"
