[package]
name = "qrkit"
description = "QRKit umbrella crate for QR scanning and reusable computer vision"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
qrkit-image = { path = "../qrkit-image" }
qrkit-geometry = { path = "../qrkit-geometry" }
qrkit-imgproc = { path = "../qrkit-imgproc" }
qrkit-qr = { path = "../qrkit-qr" }

[features]
debug-trace = ["qrkit-qr/debug-trace"]
serde = ["qrkit-qr/serde"]
