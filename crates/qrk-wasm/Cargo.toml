[package]
name = "qrk-wasm"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
qrk-core = { path = "../qrk-core", features = ["debug-trace", "serde"] }
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
