[package]
name = "qrk-ffi"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
license = "MIT"
description = "C ABI + Android JNI bindings for QRKit (Expo / mobile)"

[lib]
name = "qrk_ffi"
crate-type = ["cdylib", "staticlib"]

[dependencies]
qrkit = { path = "../qrkit", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
