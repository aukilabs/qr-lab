[package]
name = "qrk-ffi"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
license = "MIT OR Apache-2.0"
description = "C ABI + Android JNI bindings for qrk-core (Expo / mobile)"

[lib]
name = "qrk_ffi"
crate-type = ["cdylib", "staticlib"]

[dependencies]
qrk-core = { path = "../qrk-core", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
