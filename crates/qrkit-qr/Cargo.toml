[package]
name = "qrkit-qr"
description = "QR detection, decoding, robust recovery, and temporal scanning for QRKit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
qrkit-image = { path = "../qrkit-image" }
qrkit-geometry = { path = "../qrkit-geometry" }
qrkit-imgproc = { path = "../qrkit-imgproc" }
rqrr = { version = "0.10", default-features = false }
serde = { version = "1", features = ["derive"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"

[features]
debug-trace = []
serde = ["dep:serde"]

[dev-dependencies]
png = "0.18.1"
qrcode = { version = "0.14.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
