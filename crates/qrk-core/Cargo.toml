[package]
name = "qrk-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Compatibility facade for the QRKit QR scanner"

[dependencies]
qrkit-image = { path = "../qrkit-image" }
qrkit-geometry = { path = "../qrkit-geometry" }
qrkit-imgproc = { path = "../qrkit-imgproc" }
qrkit-qr = { path = "../qrkit-qr" }

[dev-dependencies]
png = "0.18.1"
qrcode = { version = "0.14.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
debug-trace = ["qrkit-qr/debug-trace"]
serde = ["qrkit-qr/serde"]
