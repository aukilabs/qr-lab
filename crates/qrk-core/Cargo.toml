[package]
name = "qrk-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
debug-trace = []
serde = ["dep:serde"]
