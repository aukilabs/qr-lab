[package]
name = "qr-lab-wasm"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
license = "MIT"
repository = "https://github.com/aukilabs/qr-lab"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
qr-lab = { path = "../qr-lab", features = ["debug-trace", "serde"] }
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
serde = { version = "1", features = ["derive"] }
# Marks `WasmSnapshot::luma` as a byte buffer so serde-wasm-bindgen sends it
# to JS as a single Uint8Array instead of a per-pixel JS number array.
serde_bytes = "0.11"
# Optional: only pulled in by the "qr-gen" feature (Plan 5 Task 5), which
# powers the debug UI's 3D-scene mode (needs to generate a QR bit matrix
# in-browser to texture a plane with). Same version/no-default-features as
# qr-lab-core's existing dev-dependency use of this crate (bitmatrix.rs,
# sample.rs, decode.rs, alignment.rs, version.rs) — default features pull
# in an `image`-crate PNG-rendering path this build never uses.
qrcode = { version = "0.14.1", default-features = false, optional = true }

[features]
# Compiles `generate_qr` into the wasm binary. Deliberately NOT a default
# feature: the mobile-relevant production build (and qr-lab-core itself) must
# stay free of the `qrcode` crate — this feature exists purely for the
# debug tool's 3D-scene mode. `scripts/build-wasm.sh` enables it (the
# debug UI wants it); `scripts/check-wasm.sh` checks both configurations.
qr-gen = ["dep:qrcode"]

[dev-dependencies]
serde_json = "1"
