[package]
name = "qr-lab-qr"
description = "QR detection, decoding, robust recovery, and temporal scanning for QR Lab"
keywords = ["qr", "barcode", "scanner", "computer-vision"]
categories = ["computer-vision", "multimedia::images"]
authors.workspace = true
homepage.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
qr-lab-image = { path = "../qr-lab-image" }
qr-lab-geometry = { path = "../qr-lab-geometry" }
qr-lab-imgproc = { path = "../qr-lab-imgproc" }
rqrr = { version = "0.11", default-features = false }
serde = { version = "1", features = ["derive"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"

[features]
debug-trace = []
serde = ["dep:serde"]

[dev-dependencies]
png = "0.18.1"
qrcode = { version = "0.14.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
