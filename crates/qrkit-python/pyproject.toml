[build-system]
requires = ["maturin>=1.14,<2.0"]
build-backend = "maturin"

[project]
name = "aukilabs-qrkit"
version = "0.1.0"
description = "Fast QR scanning and reusable computer-vision operators powered by QRKit"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT OR Apache-2.0"
authors = [{ name = "Auki Labs" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "Topic :: Multimedia :: Graphics :: Capture :: Digital Camera",
  "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Repository = "https://github.com/aukilabs/cpuscanner2"

[tool.maturin]
bindings = "pyo3"
module-name = "auki_qrkit._native"
python-source = "python"
strip = true

[tool.pytest.ini_options]
testpaths = ["tests"]

