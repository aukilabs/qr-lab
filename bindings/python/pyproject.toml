[build-system]
requires = ["maturin>=1.14,<2.0"]
build-backend = "maturin"

[project]
name = "qr-lab"
version = "0.1.0"
description = "Fast QR scanning and reusable computer-vision operators powered by QR Lab"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Auki Labs" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "Topic :: Multimedia :: Graphics :: Capture :: Digital Camera",
  "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Repository = "https://github.com/aukilabs/qr-lab"
Issues = "https://github.com/aukilabs/qr-lab/issues"
Changelog = "https://github.com/aukilabs/qr-lab/blob/develop/CHANGELOG.md"

[tool.maturin]
bindings = "pyo3"
module-name = "qr_lab._native"
python-source = "python"
strip = true

[tool.pytest.ini_options]
testpaths = ["tests"]
